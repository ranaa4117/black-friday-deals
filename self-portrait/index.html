<style>
:root{
  --paper:#ffffff; --ivory:#f6f3ee; --ink:#000; --stone:#77716b; --rule:#e5e0d9; --sale:#9b1c1c; --red:#c8102e; --mine:#efe6dc;
  --serif:"Bodoni Moda",Didot,"Times New Roman",serif; --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  --pad:clamp(16px,4vw,48px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:300 15px/1.55 var(--sans);letter-spacing:.01em;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
img{display:block;max-width:100%}
.hidden{display:none!important}

/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.brand{display:flex;flex-direction:column;align-items:center;padding:18px var(--pad) 10px;text-decoration:none}
.brand b{font:400 clamp(19px,3.2vw,26px)/1 var(--serif);letter-spacing:.22em;text-transform:uppercase}
.brand .tagline{font:300 12px/1 var(--sans);letter-spacing:.18em;color:var(--stone);margin-top:8px;text-transform:uppercase}
.top.home .brand{padding:clamp(28px,5vw,56px) var(--pad) clamp(16px,2.6vw,28px)}
.top.home .brand b{font-size:clamp(30px,5.4vw,62px);line-height:1.12;letter-spacing:.14em;text-align:center}
.top.home .brand b .ln{display:block}
.brand b .ln{font:inherit;letter-spacing:inherit;color:inherit;margin:0;text-transform:inherit}
.top.home .brand .tagline{font-size:clamp(12px,1.4vw,15px);margin-top:14px}
.top.home{position:relative}
nav.tabs{display:flex;justify-content:safe center;gap:clamp(14px,3vw,36px);padding:4px var(--pad) 12px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{text-decoration:none;font-size:13px;letter-spacing:.08em;padding:6px 0;border-bottom:1px solid transparent;color:var(--stone)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
nav.tabs .count{font-size:11px;margin-left:3px}

.status{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--stone);padding:9px var(--pad);background:var(--ivory);text-align:center}
.status .warn{color:var(--sale)}
.status button{text-decoration:underline;text-underline-offset:3px;font-size:12px;color:var(--ink)}

main{padding:0 var(--pad) 80px;max-width:1500px;margin:0 auto}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(18px,4vw,64px);align-items:center;padding:clamp(28px,5vw,64px) 0;border-bottom:1px solid var(--rule)}
.hero h1{font:400 clamp(38px,6.4vw,92px)/.98 var(--serif);letter-spacing:-.01em}
.hero .sub{font:italic 400 clamp(18px,2vw,26px)/1.3 var(--serif);margin-top:18px}
.hero p.lede{max-width:46ch;margin-top:22px;color:#3d3a37}
.hero .facts{display:flex;gap:36px;margin-top:30px;flex-wrap:wrap}
.hero .facts div{border-top:1px solid var(--ink);padding-top:10px;min-width:130px}
.hero .facts strong{display:block;font:400 34px/1 var(--serif)}
.hero .facts small{font-size:12.5px;color:var(--stone)}
.cta{display:inline-block;margin-top:32px;background:var(--ink);color:#fff;text-decoration:none;padding:14px 30px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;transition:background .2s}
.cta:hover{background:#333}
.home-pics{padding-top:clamp(14px,2.5vw,28px)}
.triptych{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end}
.triptych a{display:block;background:var(--ivory);aspect-ratio:2/3;overflow:hidden}
.triptych a:nth-child(2){aspect-ratio:2/3.6}
.triptych img{width:100%;height:100%;object-fit:cover}

.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:42px 0 20px;flex-wrap:wrap}
.section-head h2{font:400 clamp(26px,3.2vw,40px)/1.1 var(--serif)}
.section-head p{color:var(--stone);font-size:13.5px;max-width:60ch}
.section-head a{font-size:13px;text-underline-offset:4px}

/* toolbar */
.toolbar{position:sticky;top:var(--hh,108px);z-index:10;background:#fff;border-bottom:1px solid var(--rule);padding:12px 0;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;border-bottom:1px solid var(--ink);padding:4px 0}
.search input{border:0;outline:0;width:100%;background:transparent;font-size:15px;padding:4px 2px}
.toolbar select{border:1px solid var(--rule);background:#fff;padding:8px 10px;font-size:13.5px;border-radius:0}
.toolbar .tbtn{border:1px solid var(--rule);padding:8px 12px;font-size:13.5px}
.toolbar .tbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.sizebar{display:flex;flex-wrap:wrap;gap:6px;width:100%;align-items:center;font-size:12.5px;color:var(--stone)}
.sizebar button{border:1px solid var(--rule);min-width:38px;padding:5px 8px;font-size:12.5px;color:var(--ink)}
.sizebar button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.result-line{font-size:13px;color:var(--stone);padding:14px 0 4px}

/* grid + card */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:44px 22px;padding-top:18px}
.card{position:relative;display:flex;flex-direction:column}
.card .ph{position:relative;display:block;aspect-ratio:2/3;background:var(--ivory);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.6,.2,1)}
.card .ph:hover img{transform:scale(1.035)}
.card.out .ph img{opacity:.45;filter:grayscale(.6)}
.badge{position:absolute;left:0;top:12px;background:#fff;color:var(--sale);font-size:12px;font-weight:500;padding:4px 9px}
.flag{position:absolute;left:0;bottom:12px;background:var(--ink);color:#fff;font-size:11.5px;padding:4px 9px;letter-spacing:.06em}
.heart{position:absolute;right:8px;top:8px;width:38px;height:38px;display:grid;place-items:center;background:rgba(255,255,255,.92);border-radius:50%}
.heart svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.3;transition:transform .2s}
.heart[aria-pressed="true"] svg{fill:var(--ink)}
.heart:active svg{transform:scale(.85)}
.card h3{font:400 15.5px/1.35 var(--sans);margin-top:14px;letter-spacing:.01em}
.eur{font-size:13.5px;color:var(--stone);margin-top:3px}
.eur s{margin-right:6px}
.eur .now{color:var(--ink)}
.eur .pct{color:var(--sale);margin-left:6px}
.sar{font:400 27px/1.1 var(--serif);margin-top:10px}
.sar small{font:300 12px var(--sans);letter-spacing:.1em;margin-left:5px;color:var(--stone)}
.calc{font-size:11.5px;color:var(--stone);margin-top:3px}
.sizes{list-style:none;display:flex;flex-wrap:wrap;margin-top:12px;font-size:12.5px;row-gap:4px}
.sizes li{padding:0 7px;border-left:1px solid var(--rule);line-height:1.2}
.sizes li:first-child{padding-left:0;border-left:0}
.sizes li.off{color:#bdb6ae;text-decoration:line-through}
.sizes li.mine{font-weight:500}
.sizes li.mine.on{background:var(--mine);padding:1px 7px}
.sizes .sys{color:var(--stone);margin-right:2px}
.note{margin-top:10px;font:italic 400 13.5px/1.4 var(--serif);color:#3d3a37;border-left:1px solid var(--ink);padding-left:9px}
.change{margin-top:8px;font-size:11.5px;color:var(--stone)}
.acts{display:flex;gap:16px;margin-top:12px;font-size:12.5px;align-items:center}
.acts a{text-underline-offset:3px}
.acts button{text-decoration:underline;text-underline-offset:3px;color:var(--stone);font-size:12.5px}
.empty{padding:70px 0;text-align:center;color:var(--stone)}
.empty h3{font:400 26px var(--serif);color:var(--ink);margin-bottom:10px}
.more{display:block;margin:46px auto 0;border:1px solid var(--ink);padding:13px 34px;font-size:13px;letter-spacing:.1em;text-transform:uppercase}

/* compare */
.compare{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.compare th{font-weight:400;color:var(--stone);text-align:left;padding:10px 8px;border-bottom:1px solid var(--ink)}
.compare td{padding:12px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
.compare td.num{font:400 18px var(--serif);white-space:nowrap}
.compare tr.best td.num::after{content:" lowest";font:300 11px var(--sans);color:var(--sale)}
.compare img{width:44px;height:66px;object-fit:cover;background:var(--ivory)}
.table-wrap{overflow-x:auto}

/* admin */
.panel{border-top:1px solid var(--ink);padding:26px 0 34px;display:grid;grid-template-columns:260px 1fr;gap:28px}
.panel h3{font:400 22px/1.2 var(--serif)}
.panel .why{font-size:13px;color:var(--stone);margin-top:8px}
.fields{display:grid;gap:16px;max-width:640px}
label.f{display:grid;gap:5px;font-size:13px;color:var(--stone)}
label.f input,label.f textarea,label.f select{border:1px solid var(--rule);padding:10px 11px;font-size:15px;color:var(--ink);background:#fff;border-radius:0;width:100%}
label.f textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ink);padding:10px 18px;font-size:13px;letter-spacing:.06em}
.btn.solid{background:var(--ink);color:#fff}
.btn.quiet{border-color:var(--rule)}
.btn.danger{border-color:var(--sale);color:var(--sale)}
.small{font-size:12.5px;color:var(--stone)}
.mono-list{font-size:13px;display:grid;gap:6px;max-height:340px;overflow:auto;border:1px solid var(--rule);padding:10px}
.mono-list div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.edit-list{display:grid;gap:0;max-height:520px;overflow:auto;border:1px solid var(--rule)}
.edit-list button{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);font-size:13.5px}
.edit-list button:hover{background:var(--ivory)}
.edit-list img{width:40px;height:60px;object-fit:cover;background:var(--ivory)}
.tag{font-size:11px;color:var(--stone)}

/* dialog */
dialog{border:0;padding:0;width:min(620px,94vw);max-height:92vh;background:#fff;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:26px clamp(18px,4vw,32px)}
.dlg h3{font:400 26px var(--serif);margin-bottom:18px}
.size-edit{display:flex;flex-wrap:wrap;gap:6px}
.size-edit button{border:1px solid var(--ink);padding:6px 10px;font-size:13px}
.size-edit button.off{border-color:var(--rule);color:#bdb6ae;text-decoration:line-through}
.dlg .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;border-top:1px solid var(--rule);padding-top:16px}

/* gate */
#gate{position:fixed;inset:0;z-index:100;background:var(--ivory);display:grid;place-items:center;padding:24px}
#gate form{width:min(380px,100%);text-align:center}
#gate b{font:400 24px/1.2 var(--serif);letter-spacing:.22em;display:block}
#gate p{color:var(--stone);font-size:13.5px;margin:12px 0 26px}
#gate input{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:10px 4px;font-size:16px;text-align:center;outline:0}
#gate .err{color:var(--sale);font-size:13px;min-height:20px;margin-top:10px}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;font-size:13.5px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

footer{border-top:1px solid var(--rule);padding:26px var(--pad) 40px;font-size:12px;color:var(--stone);text-align:center;line-height:1.7}

.card .ph img.alt{position:absolute;inset:0;opacity:0;transition:opacity .45s}
@media (hover:hover){.card .ph:hover img.alt{opacity:1}}
.flag.light{background:rgba(255,255,255,.92);color:var(--ink)}
a.plain{text-decoration:none}
.crumbs{padding:22px 0 6px;font-size:13px}
.crumbs a{color:var(--stone);text-underline-offset:3px}
.crumbs a::before{content:"‹ "}
.pdp{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,4vw,64px);padding:12px 0 30px;align-items:start}
.gallery{position:relative;min-width:0}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--ivory);outline-offset:-2px}
.slides::-webkit-scrollbar{display:none}
.slides figure{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:2/3}
.slides img{width:100%;height:100%;object-fit:cover}
.gnav{display:flex;justify-content:center;align-items:center;gap:18px;padding:12px 0 4px;font-size:13px;color:var(--stone)}
.gnav button{width:40px;height:40px;border:1px solid var(--rule);font:300 22px/1 var(--sans)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.thumbs button{flex:0 0 64px;aspect-ratio:2/3;opacity:.55;border-bottom:1px solid transparent;padding:0}
.thumbs button[aria-current]{opacity:1;border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{position:sticky;top:calc(var(--hh,108px) + 20px)}
.info h1{font:400 clamp(28px,3.4vw,44px)/1.12 var(--serif)}
.sar.big{font-size:clamp(32px,3.4vw,44px);margin-top:16px}
.pdp-sizes{margin:24px 0 22px;padding-top:18px;border-top:1px solid var(--rule)}
.pdp-sizes .sizes{font-size:15px}
.favbtn{width:100%;padding:15px}
.details{margin-top:28px;border-top:1px solid var(--rule);padding-top:18px}
.details h2{font:400 20px var(--serif);margin-bottom:8px}
.details p{white-space:pre-line;font-size:14px;color:#3d3a37;max-width:62ch}
.pn{display:flex;justify-content:space-between;margin-top:30px;padding-top:16px;border-top:1px solid var(--rule);font-size:13px}
.pn a{text-underline-offset:3px}
@media (max-width:820px){.pdp{grid-template-columns:1fr}.info{position:static}.slides{margin:0 calc(var(--pad) * -1)}.thumbs{display:none}}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .triptych{order:-1}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 12px}
  .sar{font-size:22px}
  .card h3{font-size:14px}
  .panel{grid-template-columns:1fr;gap:14px}
  .toolbar{position:static}
  .brand b{letter-spacing:.12em;font-size:17px;text-align:center}
  .top.home .brand b{font-size:29px;letter-spacing:.08em}
  .brand .tagline{font-size:10.5px}
  nav.tabs{justify-content:flex-start}
  .hero .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .hero .facts div{min-width:0}
  .hero .facts strong{font-size:24px}
  .hero .facts small{font-size:11.5px;display:block;line-height:1.35}
  .cta{display:block;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- v2: categories, banners, filters, size guide ---- */
nav.tabs{gap:clamp(12px,2.4vw,30px)}
.banners{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:clamp(28px,4vw,48px)}
.banner{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:var(--ivory);text-decoration:none;color:#fff}
.banner img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.6,.2,1)}
.banner:hover img{transform:scale(1.04)}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0) 48%)}
.banner .cap{position:absolute;left:clamp(14px,2vw,26px);right:12px;bottom:clamp(14px,2vw,24px);z-index:1}
.banner .cap b{display:block;font:400 clamp(22px,2.6vw,34px)/1.1 var(--serif)}
.banner .cap span{font-size:13px;letter-spacing:.04em;opacity:.92}
.list-head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;padding:30px 0 6px}
.list-head h2{font:400 clamp(28px,3.6vw,46px)/1.05 var(--serif)}
.list-head p{font-size:13px;color:var(--stone)}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;width:100%}
.filters select{border:1px solid var(--rule);background:#fff;padding:8px 10px;font-size:13.5px;border-radius:0;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;font-size:12.5px;color:var(--stone)}
.chips button{border:1px solid var(--rule);min-width:38px;padding:5px 9px;font-size:12.5px;color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.verified{font-size:11.5px;color:var(--stone);margin-top:8px}
.guide-btn{margin-top:12px;align-self:flex-start;border-bottom:1px solid var(--ink);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:2px 0}
.dims{font-size:12.5px;color:#3d3a37;margin-top:10px}
.cat-tag{font-size:11px;color:var(--stone);letter-spacing:.06em;margin-top:12px}
.card .cat-tag + h3{margin-top:4px}
/* size guide drawer */
dialog.drawer{margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(560px,100vw);border-left:1px solid var(--rule)}
dialog.drawer[open]{animation:slideIn .35s cubic-bezier(.2,.7,.2,1)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.sg{padding:22px clamp(18px,3.5vw,30px) 40px}
.sg-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);padding-bottom:14px}
.sg-top h3{font:500 13px var(--sans);letter-spacing:.16em;text-transform:uppercase}
.sg-top button{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.sg h4{font:400 21px/1.2 var(--serif);margin:24px 0 4px}

/* ---------- filtering (price + colour only) ---------- */
function applyFilters(list, u){
  const q = u.q.trim().toLowerCase();
  const lo = u.pmin === "" || u.pmin == null ? -Infinity : Number(u.pmin), hi = u.pmax === "" || u.pmax == null ? Infinity : Number(u.pmax);
  let out = list.filter(p => (!q || p.title.toLowerCase().includes(q))
    && finalSAR(p) >= lo && finalSAR(p) <= hi
    && (!u.color || colorFams(p).includes(u.color)));
  const by = {
    asc: (a,b) => finalSAR(a) - finalSAR(b), desc: (a,b) => finalSAR(b) - finalSAR(a),
    disc: (a,b) => offShown(b) - offShown(a) || finalSAR(a) - finalSAR(b),
    new: (a,b) => (b.firstSeen||"").localeCompare(a.firstSeen||"") || (b.publishedAt||"").localeCompare(a.publishedAt||""),
    pop: (a,b) => favCount(b.handle) - favCount(a.handle) || favTime(b.handle) - favTime(a.handle),
    /* default: real customer interest (views, engaged time, favorites, recommendation clicks); with no data yet,
       pieces on sale with the deepest discount first */
    rank: (a,b) => interest(b.handle) - interest(a.handle) || (b.listed === false ? 0 : 1) - (a.listed === false ? 0 : 1) || offShown(b) - offShown(a) || (b.firstSeen||"").localeCompare(a.firstSeen||""),
    fav: (a,b) => (S.fav[b.handle] ? 1 : 0) - (S.fav[a.handle] ? 1 : 0) || (b.firstSeen||"").localeCompare(a.firstSeen||""),
  }[u.sort] || (() => 0);
  const down = p => p.status === "discontinued" ? 2 : isAvail(p) ? 0 : 1;
  return out.sort((a, b) => down(a) - down(b) || by(a, b));
}

const opt = (v, label, cur) => `<option value="${esc(v)}" ${String(cur) === String(v) ? "selected" : ""}>${esc(label)}</option>`;

/* main categories: Dresses → brand → Midi/Maxi · Bags → brand · Shoes → brand · Winter Sale → Jackets/Coats/Scarves */
const SECTIONS = {
  dresses: { en:"Dresses", ar:"فساتين", has: p => catOf(p) === "midi" || catOf(p) === "maxi" },
  bags:    { en:"Bags", ar:"شنط", has: p => catOf(p) === "bags" },
  shoes:   { en:"Shoes", ar:"جزم", has: p => catOf(p) === "shoes" },

};
const VS_ROUTES = ["pajamas","slippers","robes","vsbags"];
const SUB_AR = { midi:"ميدي", maxi:"ماكسي", jackets:"جاكيتات", coats:"بالطوات", scarves:"سكارفات", pajamas:"بجامات", slippers:"سليبرز", robes:"أرواب", vsbags:"شنط" };
const LEGACY = { sp:"dresses-sp", midi:"dresses-sp-midi", maxi:"dresses-sp-maxi", md:"dresses-md", jackets:"winter-jackets", coats:"winter-coats", scarves:"winter-scarves" };
function parseSec(route){
  const [sec, a, b] = route.split("-");
  if (!SECTIONS[sec]) return null;
  return sec === "winter" ? { sec, brand:"", sub:a || "" } : sec === "vs" ? { sec, brand:"", sub:a || "", style:b || "" } : { sec, brand:a || "", sub:b || "" };
}
function secList(all, r){
  let l = all.filter(SECTIONS[r.sec].has);
  if (r.brand) l = l.filter(p => brandOf(p) === r.brand);
  if (r.sub) l = l.filter(p => catOf(p) === r.sub);

  return r.sec === "vs" ? vsColourCards(l) : l;
}
function secNav(all, r){
  const S0 = SECTIONS[r.sec], inSec = all.filter(S0.has), chip = (href, label, on, ar) => `<a href="#${href}" ${ar ? 'lang="ar"' : 'dir="ltr"'} ${on ? 'aria-current="page"' : ""}>${esc(label)}</a>`;

    return h;
  }
  if (r.sec === "winter") return `<p class="winter-brand">Lauren Ralph Lauren</p><nav class="subnav" dir="rtl" aria-label="Winter Sale categories">${chip("winter", "الكل", !r.sub, true)}${WINTER_ROUTES.filter(c => inSec.some(p => catOf(p) === c)).map(c => chip("winter-" + c, SUB_AR[c], r.sub === c, true)).join("")}</nav>`;
  const brands = Object.keys(BRANDS).filter(b => inSec.some(p => brandOf(p) === b));
  let html = `<nav class="subnav" dir="rtl" aria-label="${S0.en} brands">${chip(r.sec, "الكل", !r.brand, true)}${brands.map(b => chip(r.sec + "-" + b, BRANDS[b], r.brand === b)).join("")}</nav>`;
  if (r.sec === "dresses" && r.brand){

const secTitle = r => [SECTIONS[r.sec].en, r.brand && BRANDS[r.brand], r.style && (products().find(p => p.handle === "vs-" + r.style) || {}).title, !r.style && r.sub && (r.sec === "winter" || r.sec === "vs" ? CATS[r.sub] : r.sub === "midi" ? "Midi" : r.sub === "maxi" ? "Maxi" : "")].filter(Boolean).join(" · ");
const secOf = p => isVS(p) ? "vs" : catOf(p) === "midi" || catOf(p) === "maxi" ? "dresses" : isRL(p) ? "winter" : catOf(p);

function barList(rows, fmt = arN){   // horizontal bars, one calm hue; labels stay in text ink

}
function lineChart(points){   // unique visitors over time: one series, hover shows the value

  const x = i => P.l + i * step, y = v => P.t + (H - P.t - P.b) * (1 - v / max);

    ${points.map((p, i) => `<g class="pt"><rect x="${x(i) - step / 2}" y="0" width="${step}" height="${H}" fill="transparent"><title>${p.d}: ${p.v} زائر فريد</title></rect><circle cx="${x(i)}" cy="${y(p.v)}" r="3.5"/></g>`).join("")}

  </svg></div>`;
}

function setFav(h, val){
  const was = S.fav[h] != null;
  if (was !== (val != null)) track(val ? "fav" : "unfav", { handle: h, meta: prodMeta(h) });
  if (val) S.fav[h] = val; else delete S.fav[h];
  if (was !== (val != null)){
    shareFav(h, !!val).then(ok => { if (!ok) return; let done = []; try { done = JSON.parse(store.get("sp-fav-shared") || "[]"); } catch {}
      done = val ? [...new Set([...done, h])] : done.filter(x => x !== h); store.set("sp-fav-shared", JSON.stringify(done));
      return SCORES ? loadScores() : loadTotals(); }).then(() => { const r = routeOf(); if (r === "popular" || r === "home") render(); else counts(products()); });
  }
  save(); const on = S.fav[h] != null;
  document.querySelectorAll(`.heart[data-fav="${CSS.escape(h)}"]`).forEach(b => { b.setAttribute("aria-pressed", on); b.setAttribute("aria-label", (on ? "Change size or remove from" : "Save to") + " favorites"); });
  counts(products());
  toast(on ? (val.size ? "Saved to favorites in " + val.size + "." : "Saved to favorites.") : "Removed from favorites.");
  const r = routeOf(); if (r === "favorites" || r === "popular" || r === "home" || r.startsWith("item-") || document.querySelector(`.favsize`)) render();
}
