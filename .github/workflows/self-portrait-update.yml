name: Self-Portrait sale check

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 minutes
  workflow_dispatch:
    inputs:
      sg_limit:
        description: "Size guides to read this run"
        required: false
        default: "60"
      debug:
        description: "Print size-guide diagnostics (1 = yes)"
        required: false
        default: "0"
      probe:
        description: "Product handle to inspect for the size-guide illustration"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: self-portrait-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the Spain store (midi, maxi, bags), size guides and EUR/SAR rate
        env:
          SG_LIMIT: ${{ github.event.inputs.sg_limit || '60' }}
          SG_DEBUG: ${{ github.event.inputs.debug || '0' }}
          SG_PROBE: ${{ github.event.inputs.probe || '' }}
        run: python3 tools/sp_update.py
      - name: Publish new data
        run: |
          git config user.name "self-portrait-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add self-portrait/data.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Self-Portrait sale check $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
