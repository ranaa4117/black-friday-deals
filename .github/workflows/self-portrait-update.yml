name: Self-Portrait sale check

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 minutes
  workflow_dispatch:
    inputs:
      sg_limit:
        description: "Size guides to read this run"
        required: false
        default: "60"
      debug:
        description: "Print size-guide diagnostics (1 = yes)"
        required: false
        default: "0"
      force:
        description: "Re-read every size guide (1 = yes)"
        required: false
        default: "0"
      macys_probe:
        description: "Test reading Macy's US (1 = yes)"
        required: false
        default: "0"
      ef_probe:
        description: "Test reading Elisabetta Franchi outlet (1 = yes)"
        required: false
        default: "0"
      md_probe:
        description: "Print Mac Duggal store diagnostics (1 = yes)"
        required: false
        default: "0"
      fav_test:
        description: "Test the shared favorites database (1 = yes)"
        required: false
        default: "0"
      selftest:
        description: "Test discount verification and removal rules against the live stores (1 = yes)"
        required: false
        default: "0"
      recheck:
        description: "Re-check every product that is off the sale list now (1 = yes)"
        required: false
        default: "0"
      audit:
        description: "Run the brand health check now (1 = yes)"
        required: false
        default: "0"
      probe:
        description: "Product handle to inspect for the size-guide illustration"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: self-portrait-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Macy's access test
        if: ${{ github.event.inputs.macys_probe == '1' }}
        run: python3 tools/macys_probe.py
      - name: Elisabetta Franchi access test
        if: ${{ github.event.inputs.ef_probe == '1' }}
        run: python3 tools/ef_probe.py
      - name: Mac Duggal diagnostics
        if: ${{ github.event.inputs.md_probe == '1' }}
        run: python3 tools/md_probe.py
      - name: Mac Duggal product page diagnostics
        if: ${{ github.event.inputs.md_probe == '2' }}
        run: python3 tools/md_page_probe.py
      - name: Test shared favorites database
        if: ${{ github.event.inputs.fav_test == '1' }}
        run: |
          U=https://qhuerltbkvihmqzsphpv.supabase.co/rest/v1; K=sb_publishable_K35x9gcJMqTGCuj2MFj_7w_PsQSF8mU
          D=00000000-0000-4000-8000-000000000001
          echo "totals:";  curl -s -w " [%{http_code}]\n" "$U/fav_totals?select=handle,total&limit=5" -H "apikey: $K"
          echo "add:";     curl -s -w " [%{http_code}]\n" -X POST "$U/rpc/add_fav" -H "apikey: $K" -H "Content-Type: application/json" -d "{\"p_device\":\"$D\",\"p_handle\":\"__connection-test__\"}"
          echo "add again (must not double count):"; curl -s -w " [%{http_code}]\n" -X POST "$U/rpc/add_fav" -H "apikey: $K" -H "Content-Type: application/json" -d "{\"p_device\":\"$D\",\"p_handle\":\"__connection-test__\"}"
          echo "count:";   curl -s -w " [%{http_code}]\n" "$U/fav_totals?handle=eq.__connection-test__&select=handle,total" -H "apikey: $K"
          echo "direct table read (must be refused):"; curl -s -w " [%{http_code}]\n" "$U/favs?select=*&limit=1" -H "apikey: $K"
          echo "remove:";  curl -s -w " [%{http_code}]\n" -X POST "$U/rpc/remove_fav" -H "apikey: $K" -H "Content-Type: application/json" -d "{\"p_device\":\"$D\",\"p_handle\":\"__connection-test__\"}"
          echo "count after remove:"; curl -s -w " [%{http_code}]\n" "$U/fav_totals?handle=eq.__connection-test__&select=handle,total" -H "apikey: $K"
          echo "CORS:"; curl -s -o /dev/null -D - -X OPTIONS "$U/rpc/add_fav" -H "Origin: https://ranaa4117.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: apikey,content-type" | grep -i "access-control-allow-origin" || echo "no CORS header"
      - name: Self-test (live official stores)
        if: ${{ github.event.inputs.selftest == '1' }}
        continue-on-error: true
        run: python3 tools/selftest.py
      - name: Read the Spain store (midi, maxi, bags), size guides and EUR/SAR rate
        env:
          SG_LIMIT: ${{ github.event.inputs.sg_limit || '60' }}
          SG_DEBUG: ${{ github.event.inputs.debug || '0' }}
          SG_PROBE: ${{ github.event.inputs.probe || '' }}
          SG_FORCE: ${{ github.event.inputs.force || '0' }}
          MD_ENABLE: "1"
          EF_ENABLE: "1"
          MD_CHART_DEBUG: "1"
          RECHECK_ALL: ${{ github.event.inputs.recheck || '0' }}
          REFRESH_LIMIT: ${{ github.event.inputs.recheck == '1' && '400' || '60' }}
        run: python3 tools/sp_update.py
      - name: Brand health check (hourly — compares a sample with the official stores)
        continue-on-error: true
        env:
          AUDIT_FORCE: ${{ github.event.inputs.audit || '0' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/brand_audit.py
      - name: Publish new data
        run: |
          git config user.name "self-portrait-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch self-portrait/changes.json self-portrait/selftest.json; git add self-portrait/data.json self-portrait/more.json self-portrait/full.json self-portrait/sitemap.xml self-portrait/audit.json self-portrait/changes.json self-portrait/fixes.json self-portrait/selftest.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Self-Portrait sale check $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
      - name: Record a failed update for the Admin page
        if: failure()
        run: |
          git fetch -q origin main && git reset -q --hard origin/main
          python3 - <<'PY'
          import json, datetime
          p = "self-portrait/changes.json"
          try:
              d = json.load(open(p, encoding="utf-8"))
          except Exception:
              d = {"runs": []}
          at = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          d.setdefault("runs", []).insert(0, {"at": at, "src": "auto", "ok": False, "err": "التحديث لم يكتمل ولم يتغيّر شيء في الموقع — يُعاد تلقائياً بعد ١٥ دقيقة", "items": []})
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          PY
          git config user.name "self-portrait-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add self-portrait/changes.json && git commit -qm "Record failed update" && git push -q || true
