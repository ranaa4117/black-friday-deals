name: Keep the price check running

# GitHub often skips "every 15 minutes" schedules for hours. This job starts the price check itself
# every 15 minutes for ~5h45m, then starts a fresh copy of itself, so updates keep coming.
# The hourly schedule below only restarts the chain if it ever stops.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: keep-running
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Start the price check every 15 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 23); do
            busy=$(gh run list -R "$REPO" -w self-portrait-update.yml --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
            if [ "$busy" = "0" ]; then gh workflow run self-portrait-update.yml -R "$REPO" --ref main && echo "started $(date -u +%H:%M)"; else echo "already running $(date -u +%H:%M)"; fi
            sleep 900
          done
      - name: Hand over to a fresh copy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keep-running.yml -R "${{ github.repository }}" --ref main
